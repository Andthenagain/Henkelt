<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitta ankan – Nonsens</title>
<link rel="stylesheet" href="style.css">
<style>
#pond{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:2px;background:#cfe6ef;border-radius:12px;padding:10px;user-select:none}
#pond span{font-size:24px;text-align:center;cursor:pointer;line-height:1.2}
#pond span.flip{display:inline-block;transform:scaleX(-1)}
#pond span.found{animation:spin 1s}
@keyframes spin{to{transform:scaleX(-1) rotate(720deg) scale(1.8)}}
#info{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="home" href="./">🌀 Nonsens</a><span class="tag">Hitta ankan</span></header>
  <p class="lead">En av de här 400 ankorna är inte som de andra. Hitta den.</p>
  <div class="card">
    <div id="info"><span id="t">0,0 s</span><span id="miss">Fel klick: 0</span><span id="best"></span></div>
    <div id="pond"></div>
    <p class="center"><button id="again" style="display:none">En gång till</button></p>
  </div>
</div>
<script src="common.js"></script>
<script>
const pond=document.getElementById("pond"); let start, timer, miss, done;
const fel=["Det där är en helt vanlig anka.","Den ankan har en familj.","Kvack.","Nej.","Den ankan blev kränkt.","Fel anka."];
function bestTxt(){ const b=getVal("ankbest",null); document.getElementById("best").textContent=b?("Rekord: "+b.toFixed(1).replace(".",",")+" s"):""; }
function newGame(){
  pond.innerHTML=""; miss=0; done=false; document.getElementById("miss").textContent="Fel klick: 0"; document.getElementById("again").style.display="none";
  const odd=Math.floor(Math.random()*400);
  for(let i=0;i<400;i++){ const s=document.createElement("span"); s.textContent="🦆"; if(i===odd) s.className="flip";
    s.addEventListener("click",()=>{ if(done) return;
      if(i===odd){ done=true; clearInterval(timer); s.classList.add("found"); const sec=(Date.now()-start)/1000;
        const b=getVal("ankbest",null); if(!b||sec<b) setVal("ankbest",sec); bestTxt();
        document.getElementById("t").textContent="Hittad på "+sec.toFixed(1).replace(".",",")+" s! Den tittade åt fel håll.";
        document.getElementById("again").style.display=""; unlock("anka");
      } else { miss++; document.getElementById("miss").textContent="Fel klick: "+miss+" – "+fel[miss%fel.length]; }
    }); pond.appendChild(s); }
  start=Date.now(); clearInterval(timer);
  timer=setInterval(()=>document.getElementById("t").textContent=((Date.now()-start)/1000).toFixed(1).replace(".",",")+" s",100);
}
document.getElementById("again").addEventListener("click",newGame); bestTxt(); newGame();
</script>
</body>
</html>
