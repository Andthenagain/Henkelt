<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henkelt</title>
<style>
  :root {
    --bg: #f6f5f1;
    --fg: #1d2330;
    --muted: #5b6475;
    --accent: #2a4d8f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141821;
      --fg: #eceff5;
      --muted: #a3acbd;
      --accent: #8fb0ee;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding-inline: 1.5rem;
  }
  main { max-width: 36rem; text-align: center; }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4rem);
    letter-spacing: 0.02em;
    margin: 0 0 0.5rem;
    text-wrap: balance;
  }
  p { color: var(--muted); font-size: 1.125rem; line-height: 1.6; margin: 0; }
  .rule { width: 3rem; height: 3px; background: var(--accent); margin: 1.25rem auto; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>Henkelt</h1>
  <div class="rule"></div>
  <p>Webbplatsen är under uppbyggnad. Välkommen tillbaka snart.</p>
</main>
</body>
</html>
