<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kön – Nonsens</title>
<link rel="stylesheet" href="style.css">
<style>
#nr{font-size:clamp(70px,16vw,140px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#ticket{display:inline-block;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:24px 40px;margin:10px 0 18px}
#status{min-height:50px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="home" href="./">🌀 Nonsens</a><span class="tag">Kön</span></header>
  <div class="card center">
    <p class="muted">Din plats i kön:</p>
    <div id="ticket"><div id="nr">–</div></div>
    <div id="status">Kön till ingenting. Vänligen vänta.</div>
    <p><button id="tranga">Försök tränga dig</button> <button id="lamna">Lämna kön</button></p>
    <p class="muted small">Ditt besök är viktigt för oss. Tänk inte på vad kön leder till.</p>
  </div>
</div>
<script src="common.js"></script>
<script>
const nr=document.getElementById("nr"), st=document.getElementById("status");
let pos=37+Math.floor(Math.random()*20), done=false;
const vanta=["Ditt besök är viktigt för oss.","Någon framför dig hittade inte sin plånbok.","Kassan stängde. En annan öppnade. Samma kassa.",
"Personen framför dig vill prata om vädret.","Det går fort nu. Relativt sett.","Kön rör sig. Troligen.","Hissmusik spelas i bakgrunden. ♪","En ny kö har öppnat. Du står inte i den."];
function show(){ nr.textContent=pos; }
show();
function tick(){
  if(done) return;
  const r=Math.random();
  if(r<.6){ pos--; st.textContent=vanta[Math.floor(Math.random()*vanta.length)]; }
  else if(r<.72){ pos+=2; st.textContent="Två personer hade en kompis som höll plats. Du flyttades bakåt."; }
  else st.textContent="Ingenting hände.";
  if(pos<=1){ pos=1; done=true; show(); st.textContent="Du är först! Tyvärr har kön stängt för dagen. Välkommen åter."; unlock("ko"); return; }
  show(); setTimeout(tick, 2500+Math.random()*4000);
}
setTimeout(tick, 3000);
document.getElementById("tranga").addEventListener("click",()=>{ if(done) return;
  if(Math.random()<.15){ pos=Math.max(2,pos-5); st.textContent="Det funkade! Ingen märkte något. Skäms lite."; }
  else { pos+=10; st.textContent="Du blev upptäckt. Tio steg bakåt. Folk tittar på dig."; } show(); });
document.getElementById("lamna").addEventListener("click",()=>{ st.textContent="Du kan inte lämna kön. Du har redan investerat för mycket tid."; });
</script>
</body>
</html>
